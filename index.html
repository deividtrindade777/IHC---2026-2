<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | IHC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <main class="login-card">
        <section class="welcome-panel" aria-label="Apresentação">
            <a class="brand" href="#" aria-label="Nexo, página inicial"><span class="brand-mark">N</span><span>Nexo</span></a>
            <div class="welcome-content">
                <p class="eyebrow">SEU ESPAÇO, SEU RITMO</p>
                <h1>Bem-vindo de volta.</h1>
                <p>Organize suas ideias, acompanhe seus projetos e faça cada dia render mais.</p>
            </div>
            <div class="panel-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
        </section>
        <section class="form-panel" aria-labelledby="login-title">
            <div class="form-heading"><p class="greeting">Olá novamente!</p><h2 id="login-title">Entre na sua conta</h2><p>Use seus dados para continuar.</p></div>
            <form>
                <label for="email">E-mail</label>
                <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m4 7 8 6 8-6"/></svg><input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="email"></div>
                <div class="label-row"><label for="password">Senha</label><a href="#">Esqueceu a senha?</a></div>
                <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password"><button class="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
                <label class="remember"><input type="checkbox"><span class="checkbox"></span>Lembrar de mim</label>
                <button class="submit-button" type="submit">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5"/></svg></button>
            </form>
            <p class="form-status" aria-live="polite"></p>
            <div class="divider"><span>ou continue com</span></div>
            <button class="google-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.52h3.25c1.9-1.75 2.8-4.33 2.8-7.29Z"/><path fill="#34A853" d="M12 21.74c2.63 0 4.84-.87 6.45-2.36L15.2 16.9c-.87.58-1.98.92-3.2.92-2.46 0-4.55-1.66-5.3-3.9H3.34v2.6A9.74 9.74 0 0 0 12 21.74Z"/><path fill="#FBBC05" d="M6.7 13.92A5.86 5.86 0 0 1 6.4 12c0-.67.12-1.31.3-1.92v-2.6H3.34A9.74 9.74 0 0 0 2.26 12c0 1.57.38 3.06 1.08 4.52l3.36-2.6Z"/><path fill="#EA4335" d="M12 6.18c1.35 0 2.56.46 3.52 1.36l2.64-2.64C16.83 3.67 14.62 2.26 12 2.26a9.74 9.74 0 0 0-8.66 5.22l3.36 2.6c.75-2.24 2.84-3.9 5.3-3.9Z"/></svg>Google</button>
            <p class="signup">Ainda não tem uma conta? <a href="#">Criar conta</a></p>
        </section>
    </main>
</body>
</html>
